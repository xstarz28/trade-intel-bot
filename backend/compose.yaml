services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trade_intel
      POSTGRES_USER: trade_intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trade_intel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_intel -d trade_intel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://trade_intel:${POSTGRES_PASSWORD}@database:5432/trade_intel
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trade_intel_postgres:
