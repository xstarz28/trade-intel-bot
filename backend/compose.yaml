services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/trade-intel.sqlite
      STATIC_DIR: /app/dist
      NODE_ENV: ${NODE_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:-https://xstarzganaliys.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://xstarzganaliys.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "8787"
    volumes:
      - trade_intel_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in backend/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  trade_intel_data:
  caddy_data:
  caddy_config:
