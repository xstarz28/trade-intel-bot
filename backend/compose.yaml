services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/trade-intel.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - trade_intel_data:/data
    restart: unless-stopped

volumes:
  trade_intel_data:
