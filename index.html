<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Phase 179 — viewport-fit=cover populates env(safe-area-inset-*) on
       notched devices; maximum-scale/user-scalable are NOT set, so pinch-zoom
       and OS text scaling keep working (accessibility). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Xstarz Analysis — decision-support market analysis</title>
  <!-- Phase 190 — the description must match implemented capability: no
       "real-time" claim (provider availability is conditional), no accuracy
       or profit claim, and no canonical/og:url because no production domain
       is registered yet. Adding a fake canonical would be worse than none. -->
  <meta name="description"
    content="Xstarz Analysis is a decision-support tool for market bias analysis. It does not execute trades and does not guarantee profit." />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
