name: Production deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
        type: string
      confirm:
        description: "Type DEPLOY_PROD to confirm a manual production deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Convex production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      XSTARZ_DEPLOYMENT_ENV: ${{ vars.XSTARZ_DEPLOYMENT_ENV }}
    steps:
      - name: Require confirmation for manual deploys
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY_PROD" ]; then
            echo "::error::Manual production deploy requires DEPLOY_PROD."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify production identity
        env:
          EXPECTED_DEPLOYMENT: prod:xstarz-production:xstarz-analysis
          EXPECTED_URL: https://hushed-seal-237.convex.cloud
        run: |
          set -euo pipefail
          test -n "${CONVEX_DEPLOY_KEY:-}" || { echo "::error::CONVEX_DEPLOY_KEY missing"; exit 1; }
          test "${CONVEX_DEPLOYMENT:-}" = "${EXPECTED_DEPLOYMENT}" || { echo "::error::Wrong CONVEX_DEPLOYMENT"; exit 1; }
          test "${VITE_CONVEX_URL:-}" = "${EXPECTED_URL}" || { echo "::error::Wrong VITE_CONVEX_URL"; exit 1; }

      - name: Configure Convex Auth redirect proxy
        run: |
          set -euo pipefail
          npx convex env set AUTH_REDIRECT_PROXY_URL 'https://xstarzanalysis.vercel.app/api/auth'
          npx convex env set SITE_URL 'https://xstarzanalysis.vercel.app'

      - name: Build and deploy backend
        run: npx convex deploy --yes --typecheck disable --cmd "npm run build" --cmd-url-env-var-name VITE_CONVEX_URL
