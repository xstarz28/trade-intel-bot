name: Retired - Convex production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Convex production deployment is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deployment
        run: |
          echo "::error::Convex production deployment is retired. Deploy only through the self-hosted backend after host, secrets, backup and DNS acceptance are configured."
          exit 1
