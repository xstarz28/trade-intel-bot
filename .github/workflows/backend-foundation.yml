name: Backend Foundation CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-foundation.yml"
  push:
    branches:
      - "architecture/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-foundation.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend tests
        run: npm test
      - name: Check backend JavaScript syntax
        run: npm run check
