# Phase 287 — REAL deployed-runtime four-asset smoke.
#
# WHY THIS EXISTS
# ---------------
# A deployment can exist, answer HTTP 200, and still be stale, unauthenticated,
# or unable to reach a single provider. The development deployment workflow
# proves a deploy happened; it cannot prove the deployed runtime does anything
# useful with real market data. This workflow asks the RUNNING deployment, from
# a networked runner, to analyse one instrument per asset class and reports what
# actually came back.
#
# WHAT MAKES THE RESULT TRUSTWORTHY
# ---------------------------------
# · It runs on a GitHub runner, not in a developer sandbox, so the deployment is
#   reached over the public internet exactly as a user reaches it.
# · It installs and runs the repository's OWN smoke script. No stub, no fixture
#   and no localhost path exists in it; the request body carries only the
#   discovered identity, timeframe and trading style.
# · Instruments come from the deployment's OWN discovery actions at run time.
#   No ticker is hardcoded, in the workflow or in the script.
# · Each asset class gets its own fresh anonymous session, so one domain cannot
#   spend another domain's guest allowance.
# · PASS is never inferred from HTTP 200: the run is green only when the
#   runtime returned provider market evidence with a provider observation
#   instant, plus technical, domain-native fundamental and unified evidence.
#   Missing provider/data is reported UNAVAILABLE with the runtime's own reason.
# · It never targets production and never admits a release.
#
# CREDENTIALS
# -----------
# This workflow needs NO repository secret. Provider API keys live in the
# development deployment's own environment, server-side; the runner only speaks
# the app's public HTTP contract to it. Nothing here reads or prints a key.
#
# Required GitHub Environment: `development` (the same one the deploy uses)
#   variable  CONVEX_DEPLOYMENT   dev:<team>:<project> — recorded for provenance

name: Development runtime smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to run the smoke from (defaults to the dispatched ref)"
        required: false
        type: string
      domains:
        description: "Comma-separated asset classes (default: crypto,forex,stock,commodity)"
        required: false
        type: string
      max_attempts:
        description: "Max discovery-ranked instruments tried per domain (1-3, default 3)"
        required: false
        type: string
      exact_instruments:
        description: "Optional exact live-verification specs (provider:assetClass:nativeId[@TF] CSV), e.g. okx:crypto:BTC-USDT,twelve-data:commodity:XAU/USD@H1,twelve-data:forex:EUR/USD@M15 — requested verbatim through the same protected analysis (timeframe default D1; a silently substituted timeframe FAILS); never a substitute for discovery"
        required: false
        type: string
      probe_limit:
        description: "Commodity energy-gate probe scan depth in the provider's own order (1-40, default 12)"
        required: false
        type: string
      pacing_window_ms:
        description: "Twelve Data minute-window pacing: window length in ms (default 60000; 0 DISABLES pacing)"
        required: false
        type: string
      pacing_limit:
        description: "Twelve Data minute-window pacing: modelled credits per window (default 8 = the plan the runtime's own 429 named)"
        required: false
        type: string
      pacing_max_wait_ms:
        description: "Twelve Data minute-window pacing: total wait budget for the run (default 900000, cap 1500000; 0 DISABLES pacing)"
        required: false
        type: string
      target_url:
        description: "Optional deployment URL to smoke (https on *.convex.cloud). Default: the development deployment. tough-goose-455 is always refused."
        required: false
        type: string
  # Phase 309 — see development-deploy.yml: the RELAY workflow
  # (development-dispatch-relay.yml) converts a repository dispatch into an
  # explicit workflow_dispatch from the default branch. This workflow's body
  # is gated to workflow_dispatch, so a repository dispatch event can NEVER
  # run the smoke directly — it can only be relayed into one.
  repository_dispatch:
    types: [development-runtime-smoke-relay]

permissions:
  contents: read

concurrency:
  group: development-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Four-asset smoke against the deployed development runtime
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      # The REAL development deployment. Fixed here on purpose: a smoke whose
      # target could drift is a smoke that can silently measure the wrong thing.
      # The script refuses any target that is not this host (or an explicitly
      # allowed one), and refuses the retired deployments by name.
      # Default target: the NEW Xstarz Analysis development deployment. An
      # explicit `target_url` input may point the SAME fail-closed harness at
      # another deployment (the production-activation verification); the
      # retired tough-goose-455 is always refused, and pleasant-curlew-264 (the
      # retired free-plan-disabled deployment) is refused by name.
      XSTARZ_SMOKE_URL: ${{ inputs.target_url || 'https://calculating-eagle-241.convex.cloud' }}
      XSTARZ_SMOKE_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
      XSTARZ_SMOKE_DOMAINS: ${{ inputs.domains }}
      XSTARZ_SMOKE_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      XSTARZ_SMOKE_PROBE_LIMIT: ${{ inputs.probe_limit }}
      # Phase 289 quota-audit — minute-window pacing (see scripts/development-runtime-smoke.mjs).
      # These mirror CLI flags of the same name; an empty input falls back to the
      # script's own bounded default (a 60 s window, 8 credits, 15 min budget).
      XSTARZ_SMOKE_PACING_WINDOW_MS: ${{ inputs.pacing_window_ms }}
      XSTARZ_SMOKE_PACING_LIMIT: ${{ inputs.pacing_limit }}
      XSTARZ_SMOKE_PACING_MAX_WAIT_MS: ${{ inputs.pacing_max_wait_ms }}
      XSTARZ_SMOKE_EXACT: ${{ inputs.exact_instruments }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (the repository's own install mode)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Refuse to point this smoke at anything but a development deployment
        run: |
          case "${XSTARZ_SMOKE_URL}" in
            https://*.convex.cloud) ;;
            *) echo "::error title=Refused::XSTARZ_SMOKE_URL is not an https *.convex.cloud deployment"; exit 1 ;;
          esac
          case "${XSTARZ_SMOKE_URL}" in
            *tough-goose-455.convex.cloud*) echo "::error title=Refused::tough-goose-455 is the RETIRED deployment and must never be targeted"; exit 1 ;;
          esac
          case "${XSTARZ_SMOKE_URL}" in
            *pleasant-curlew-264.convex.cloud*) echo "::error title=Refused::XSTARZ_SMOKE_URL is the retired free-plan-disabled deployment (pleasant-curlew-264.convex.cloud)"; exit 1 ;;
          esac
          echo "target: ${XSTARZ_SMOKE_URL}"
          echo "deployment (provenance only): ${XSTARZ_SMOKE_DEPLOYMENT:-<not set>}"
          echo "source commit: $(git rev-parse HEAD)"
          # Phase 289B — provenance: the CHECKOUT is what the harness ran from,
          # and it is NOT the same thing as github.sha whenever this workflow is
          # dispatched from one ref while checking out another (`ref` input). The
          # smoke reports both, labelled, and never derives a revision from
          # `/version` (that is the running Convex backend version, not this
          # application's function bundle).
          echo "XSTARZ_SMOKE_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run the four-asset smoke against the deployed runtime
        # Exit 0 = nothing FAILED (PASS and UNAVAILABLE are both honest outcomes
        # when the runtime says why). Exit 1 = at least one domain FAILED.
        # Exit 2 = the deployment could not be reached, and then nothing about
        # the runtime may be concluded — "could not look" is not a clean result.
        run: |
          set -o pipefail
          args=(--url "${XSTARZ_SMOKE_URL}" --allow-host "$(printf '%s' "${XSTARZ_SMOKE_URL}" | sed -E 's#^https://([a-z0-9.-]+\.convex\.cloud).*#\1#')" --out development-runtime-smoke.json)
          if [ -n "${XSTARZ_SMOKE_DOMAINS:-}" ]; then args+=(--domains "${XSTARZ_SMOKE_DOMAINS}"); fi
          if [ -n "${XSTARZ_SMOKE_MAX_ATTEMPTS:-}" ]; then args+=(--max-attempts "${XSTARZ_SMOKE_MAX_ATTEMPTS}"); fi
          node scripts/development-runtime-smoke.mjs "${args[@]}" 2>&1 | tee smoke-console.log

      - name: Summary (prints even when the smoke failed)
        if: always()
        run: |
          if [ -f development-runtime-smoke-summary.txt ]; then
            cat development-runtime-smoke-summary.txt
          else
            echo "No summary file was produced — the smoke did not get far enough to write one."
          fi

      - name: Upload the smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-runtime-smoke-${{ github.run_id }}
          path: |
            development-runtime-smoke.json
            development-runtime-smoke-summary.txt
            smoke-console.log
          if-no-files-found: warn
          retention-days: 30

      - name: This job does not admit a release
        if: always()
        run: |
          echo "A green runtime smoke means the development deployment answered with real provider evidence."
          echo "It is not production verification, not Evidence D, and not release admission."
