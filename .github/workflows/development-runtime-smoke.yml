name: Retired - Convex development runtime smoke

on:
  workflow_dispatch:
  repository_dispatch:
    types: [development-runtime-smoke-relay]

permissions:
  contents: read

jobs:
  retired:
    name: Convex development smoke is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy smoke target
        run: |
          echo "::error::Convex development runtime smoke is retired. Use the self-hosted production acceptance workflow after xstarzganaliys.com is deployed."
          exit 1
