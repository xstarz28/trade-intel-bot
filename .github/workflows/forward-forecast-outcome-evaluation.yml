name: Real forward forecast outcome evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/forward-forecast.ts"
      - "src/lib/backtest/forward-forecast-evaluation*"
      - ".github/workflows/forward-forecast-outcome-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-forecast-outcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Replay fixed forecast hypothesis on untouched Binance Spot assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run real forward forecast outcome replay
        env:
          RUN_REAL_FORWARD_FORECAST_EVALUATION: "1"
        run: npx vitest run src/lib/backtest/forward-forecast-evaluation.live.test.ts --testTimeout=900000
      - name: Upload reproducible forecast and OHLCV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-intel-forward-forecast-oos-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
