name: Donchian ATR forward hypothesis OOS evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/backtest/donchian-atr-hypothesis.live.test.ts"
      - "src/lib/backtest/forward-forecast-evaluation.ts"
      - "src/lib/backtest/historical-ohlcv.ts"
      - ".github/workflows/donchian-atr-oos-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/backtest/donchian-atr-hypothesis.live.test.ts"
      - "src/lib/backtest/forward-forecast-evaluation.ts"
      - "src/lib/backtest/historical-ohlcv.ts"
      - ".github/workflows/donchian-atr-oos-evaluation.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donchian-atr-oos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate fixed Donchian hypothesis on untouched assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Replay pre-registered OOS hypothesis
        env:
          RUN_REAL_DONCHIAN_ATR_EVALUATION: "1"
        run: npx vitest run src/lib/backtest/donchian-atr-hypothesis.live.test.ts --testTimeout=900000
      - name: Upload auditable OHLCV and OOS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-intel-donchian-atr-oos-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
