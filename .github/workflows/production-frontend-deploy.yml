name: Retired - Vercel production frontend deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Vercel production deployment is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deployment
        run: |
          echo "::error::Vercel production deployment is retired. The production target is the self-hosted Docker/Caddy stack at xstarzganaliys.com."
          exit 1
