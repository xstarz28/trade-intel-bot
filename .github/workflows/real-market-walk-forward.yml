name: Real-Market Walk-Forward (Yahoo Finance)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-market-walk-forward.yml"
      - "src/lib/backtest/**"
      - "src/lib/analysis-engine.ts"
      - "src/lib/data/**"

permissions:
  contents: read

jobs:
  historical-walk-forward:
    name: Production engine · real historical OHLCV · out-of-sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run production decision engine against real daily market history
        env:
          RUN_REAL_MARKET_WALK_FORWARD: "1"
        run: npx vitest run src/lib/backtest/real-market-walk-forward.live.test.ts --reporter=verbose

      - name: Upload reproducible market data and metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-market-walk-forward-evidence-${{ github.run_id }}
          path: artifacts/real-market-walk-forward/*.json
          if-no-files-found: warn
          retention-days: 30
