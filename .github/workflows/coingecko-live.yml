name: CoinGecko Live Integration (Public API)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/coingecko-live.yml"
      - "scripts/verify-coingecko-live.mjs"
      - "scripts/verify-coingecko-live.test.mjs"

permissions:
  contents: read

jobs:
  verify-live-provider:
    name: Verify CoinGecko live quotes without requiring a key
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Verify real public CoinGecko quotes
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: node scripts/verify-coingecko-live.mjs
