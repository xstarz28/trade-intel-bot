name: CI

on:
  push:
    branches: ["main", "arena/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test · typecheck · build · lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck and production build
        env:
          VITE_CONVEX_URL: https://hushed-seal-237.convex.cloud
        run: npm run build
      - name: Test release verifier lazy-chunk discovery
        run: node --test scripts/verify-frontend-release.smoke.test.mjs
      - name: Syntax-check production runtime smoke
        run: node --check scripts/production-runtime-smoke.mjs
      - name: Test suite
        run: npm test
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
