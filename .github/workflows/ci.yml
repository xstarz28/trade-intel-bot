name: CI

on:
  push:
    branches: ["main", "arena/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test · typecheck · build · lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -ryaml -e 'ARGV.each { |path| YAML.parse_file(path); puts "Valid YAML: #{path}" }' .github/workflows/*.yml
      - name: Enforce Convex-independent application runtime
        run: npm run audit:convex-runtime

      - name: Typecheck and production build
        run: npm run build
      - name: Verify built frontend release artifact provenance
        run: node scripts/verify-frontend-release.mjs --dist dist --expect-commit "$GITHUB_SHA" --expect-branch "$GITHUB_REF_NAME"
      - name: Test release verifier lazy-chunk discovery
        run: node --test scripts/verify-frontend-release.smoke.test.mjs
      - name: Test Google OAuth configuration validator
        run: node --test scripts/verify-google-auth-config.test.mjs
      - name: Syntax-check production runtime smoke
        run: node --check scripts/production-runtime-smoke.mjs
      - name: Test production smoke forecast status parsing
        run: node --test scripts/forecast-contract-validation.test.mjs
      - name: Test suite
        run: npm test
      - name: Strict lint for market-execution integrity modules
        run: npx eslint src/lib/execution-quality.ts src/lib/execution-quality.test.ts src/convex/okx.ts
      - name: Strict lint for forward-forecast research harness
        run: npx eslint src/lib/backtest/donchian-atr-hypothesis.live.test.ts
      - name: Strict lint for forward-path, forecast evaluation, and fundamental integrity modules
        run: >-
          npx eslint src/lib/forward-market-path.ts src/lib/forward-forecast.ts
          src/lib/backtest/walk-forward.ts src/lib/backtest/forward-forecast-evaluation.ts
          src/lib/backtest/forward-forecast-evaluation.live.test.ts src/lib/fundamental-thesis.ts
          src/lib/data/sec-edgar.ts src/convex/marketRadarScheduler.ts src/convex/secEdgar.ts
      - name: Strict lint for authentication modules changed in this PR
        run: npx eslint src/hooks/use-auth.ts src/hooks/use-backend-session.ts src/hooks/__tests__/use-auth.test.ts src/lib/backend-api.ts src/lib/auth-redirect.ts src/lib/auth-redirect.test.ts src/pages/Auth.tsx src/components/RequireAuth.tsx src/main.tsx
      - name: Enforce ESLint baseline without new violations
        run: |
          mkdir -p artifacts
          set +e
          npx eslint . --format json > artifacts/eslint-current.json
          lint_status=$?
          set -e
          if [ "$lint_status" -gt 1 ]; then
            echo "::error::ESLint failed to execute; inspect configuration or parser errors."
            exit "$lint_status"
          fi
          node scripts/check-eslint-baseline.mjs artifacts/eslint-current.json docs/quality/eslint-baseline-2026-11-02.json
      - name: Upload machine-readable ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_id }}
          path: artifacts/eslint-current.json
          if-no-files-found: ignore
          retention-days: 14
