name: Resolve package lockfile (one-time)
on:
  push:
    branches:
      - fix/lint-and-market-safety-20261019
    paths:
      - ".github/workflows/resolve-lockfile-once.yml"
permissions:
  contents: write
jobs:
  lockfile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lint-and-market-safety-20261019
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Validate dependency graph
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm audit --audit-level=high
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current; no commit needed."
            exit 0
          fi
          git commit -m "build: commit reproducible npm lockfile"
          git push origin HEAD:fix/lint-and-market-safety-20261019
