name: Retired - Convex development dispatch relay

on:
  repository_dispatch:
    types: [development-deploy]

permissions:
  contents: read

jobs:
  retired:
    name: Legacy Convex dispatch is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy dispatch
        run: |
          echo "::error::The Convex development dispatch relay is retired."
          exit 1
