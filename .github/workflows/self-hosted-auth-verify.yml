name: Self-hosted Google OAuth configuration verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify self-hosted Google OAuth environment
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OAuth configuration without printing secret values
        run: npm run auth:verify
