name: Real historical walk-forward report

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/backtest/**"
      - ".github/workflows/historical-walk-forward-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-walk-forward-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Fetch real OHLCV and evaluate OOS folds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run real historical evaluation
        env:
          RUN_REAL_HISTORICAL_EVALUATION: "1"
        run: npx vitest run src/lib/backtest/historical-walk-forward.live.test.ts --testTimeout=900000
      - name: Upload auditable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-intel-historical-walk-forward-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
