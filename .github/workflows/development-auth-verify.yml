name: Retired - Convex development auth verify

on:
  workflow_dispatch:
  repository_dispatch:
    types: [development-auth-verify-relay]

permissions:
  contents: read

jobs:
  retired:
    name: Convex auth verification is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy auth verification
        run: |
          echo "::error::Convex auth verification is retired. Self-hosted Google OAuth configuration is validated by npm run auth:verify and the self-hosted auth configuration workflow."
          exit 1
