name: Development auth verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA containing the verifier (defaults to the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: development-auth-verify
  cancel-in-progress: false

jobs:
  auth-verify:
    name: Verify development Google auth configuration (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - name: Check out the selected verifier source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Fail closed unless the configured target is the intended development deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is absent from the development environment."
            exit 1
          fi
          case "${CONVEX_DEPLOYMENT:-}" in
            dev:*) ;;
            *) echo "::error::CONVEX_DEPLOYMENT must identify a dev deployment; refusing to inspect or mutate another environment."; exit 1 ;;
          esac
          if ! printf '%s' "${VITE_CONVEX_URL:-}" | grep -Eq '^https://[a-z0-9][a-z0-9-]*\.convex\.cloud$'; then
            echo "::error::VITE_CONVEX_URL must be an HTTPS *.convex.cloud origin."
            exit 1
          fi
          host="${VITE_CONVEX_URL#https://}"
          slug="${host%.convex.cloud}"
          case "$slug" in
            tough-goose-455|pleasant-curlew-264|calculating-eagle-241)
              echo "::error::The configured Convex host is retired; refusing to verify Google auth against it."
              exit 1
              ;;
          esac
          expected_fingerprint="dev:$slug"
          actual_fingerprint="${CONVEX_DEPLOY_KEY%%|*}"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::Deploy-key target does not match the configured development host (expected $expected_fingerprint, found $actual_fingerprint)."
            exit 1
          fi
          echo "Development deployment identity checks passed for host $slug; no credential values were printed."

      - name: Read auth variables from the selected deployment without logging values
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/convex-env-list.txt"
          if ! npx convex env list > "$env_file" 2> "$RUNNER_TEMP/convex-env-list.err"; then
            echo "::error::Could not read the selected development deployment's environment; raw CLI output is suppressed."
            exit 1
          fi
          while IFS= read -r line; do
            case "$line" in
              AUTH_GOOGLE_ID=*|AUTH_GOOGLE_SECRET=*|SITE_URL=*|CONVEX_SITE_URL=*)
                export "$line"
                ;;
            esac
          done < <(grep -E '^(AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET|SITE_URL|CONVEX_SITE_URL)=' "$env_file" || true)

          # Convex supplies CONVEX_SITE_URL as a system value; it may not appear
          # in env list. Derive its host only from the already-verified backend.
          if [ -z "${CONVEX_SITE_URL:-}" ]; then
            export CONVEX_SITE_URL="${VITE_CONVEX_URL%.convex.cloud}.convex.site"
            echo "::notice::CONVEX_SITE_URL is system-derived from the verified backend host."
          fi

          set +e
          npm run auth:verify -- --json | tee auth-verify.json
          status="${PIPESTATUS[0]}"
          set -e
          state="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("auth-verify.json","utf8")).state)')"
          echo "::notice title=Google auth configuration state::$state"
          if [ "$status" -ne 0 ]; then
            echo "::error::Google auth configuration is not accepted; inspect only the missing/invalid variable names in the report."
            exit "$status"
          fi

      - name: Upload the non-secret configuration verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-verify-${{ github.run_id }}
          path: auth-verify.json
          if-no-files-found: warn
          retention-days: 30

      - name: State the acceptance boundary
        if: always()
        run: |
          echo "CONFIGURED means required variables are present and structurally plausible."
          echo "This read-only workflow does not create guest sessions, run cleanup, deploy code, or prove browser Google sign-in."
