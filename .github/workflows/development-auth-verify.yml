# Phase 315 — Google authentication configuration acceptance.
#
# WHY THIS EXISTS
# ---------------
# Phase 311 shipped the auth surface and its operator verifier
# (`scripts/verify-google-auth-config.mjs`, npm script `auth:verify`). The
# verifier classifies THIS environment's variables into exactly three honest
# states — CONFIGURED / NOT_CONFIGURED / INVALID — and never prints a value.
# Until now it had no runtime wiring: this workflow runs it against the
# deployed development deployment's own environment from a networked runner,
# through the same `development` environment the deploy uses.
#
# WHAT MAKES THE RESULT TRUSTWORTHY
# ---------------------------------
# · It reads the deployment's REAL variables (`npx convex env list` under the
#   dev-scoped `CONVEX_DEPLOY_KEY`), filters to the four auth-relevant names,
#   and exports them into the verifier's process — values are never echoed,
#   logged, or uploaded. The JSON report carries state + missing NAMES only.
# · Fail-closed: exit 1 (NOT_CONFIGURED) and exit 2 (INVALID) both fail the
#   job with the exact missing/invalid variable names as the message. A missing
#   credential is a named external dependency, never a simulated PASS.
# · The verifier itself restates: configuration validity is not sign-in
#   acceptance — a real browser sign-in remains a separate act (phase 311).
#
# CREDENTIALS: only `CONVEX_DEPLOY_KEY` (dev-scoped, the deploy key the deploy
# workflow already uses). No Google secret is stored, read as a value, or
# printed anywhere.

name: Development auth verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to verify (defaults to the dispatched ref)"
        required: false
        type: string
  repository_dispatch:
    types: [development-auth-verify-relay]

permissions:
  contents: read

concurrency:
  group: development-auth-verify
  cancel-in-progress: false

jobs:
  auth-verify:
    name: Classify the deployment's Google auth configuration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (the repository's own install mode)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Read the deployment's auth variables and classify (values never printed)
        env:
          AUTH_VERIFY_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          echo "verifying ref: ${AUTH_VERIFY_REF}"
          # Pull the deployment's OWN variable list, keep only the four
          # auth-relevant names, export them into the verifier's process.
          # Values stay in the process environment — never echoed, never
          # redirected to disk, never uploaded.
          AUTH_VARS="$(npx convex env list 2>/dev/null | grep -E '^(AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET|CONVEX_SITE_URL|SITE_URL)=' || true)"
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            export "${line%%=*}=${line#*=}"
          done <<< "${AUTH_VARS}"
          set +e
          node scripts/verify-google-auth-config.mjs --json | tee auth-verify.json
          STATUS="${PIPESTATUS[0]}"
          set -e
          STATE="$(jq -r '.state' auth-verify.json)"
          MISSING="$(jq -r 'if (.missing | length) > 0 then (.missing | join(",")) else "none" end' auth-verify.json)"
          INVALID="$(jq -r 'if (.invalid | length) > 0 then (.invalid | join("; ")) else "none" end' auth-verify.json)"
          CALLBACK="$(jq -r '.callbackUrl // "none"' auth-verify.json)"
          LEVEL="notice"
          [ "${STATE}" = "GOOGLE_AUTH_NOT_CONFIGURED" ] && LEVEL="warning"
          [ "${STATE}" = "GOOGLE_AUTH_INVALID" ] && LEVEL="error"
          echo "::${LEVEL} title=Google auth ${STATE}::state=${STATE} · missing=${MISSING} · invalid=${INVALID} · callback=${CALLBACK} · config-validity only, a real browser sign-in is a separate acceptance act"
          echo "auth state: ${STATE} (missing: ${MISSING})"
          exit "${STATUS}"

      - name: Anonymous runtime sign-in — capture the exact underlying error
        # Launch-activation diagnostic: the smoke harness sanitizes the sign-in
        # error, so the exact runtime failure was unreadable. This runs ONE
        # real anonymous sign-in against the deployment (exactly what every
        # smoke run does) and re-emits the verifier's own output as
        # annotations. Does not change the job's conclusion.
        if: always()
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set +e
          npx convex run auth:signIn '{"provider":"anonymous"}' > /tmp/signin-before.txt 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "::notice title=anonymous sign-in::PASS before any remediation (a real session was created)"
          else
            tail -4 /tmp/signin-before.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=auth:signIn failed::${line:0:600}"
            done
          fi

      - name: Bounded retention sweep (the Phase-320 documented CLI lifecycle)
        # The retention sweep is the deployment's designed, delete-only,
        # idempotent storage-recovery lifecycle ("2026-10-12 cron or owner
        # CLI"). If the deployment is over its plan's storage limit, data-plane
        # writes (which anonymous sign-in performs) can be refused while
        # control-plane pushes still succeed — exactly the observed split.
        # Draining the legacy staging rows IS the documented remedy. Bounded
        # to 6 invocations; stops immediately on the first error.
        if: always()
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          for i in 1 2 3 4 5 6; do
            OUT="$(npx convex run discoveryRetention:runBoundedCleanupSweep '{}' 2>&1 | tail -2)"
            echo "::notice title=retention sweep ${i}/6::$(printf '%s' "$OUT" | tr '\r\n' '  ' | head -c 500)"
            RC=$?
            if [ "$RC" -ne 0 ] || printf '%s' "$OUT" | grep -qi "error"; then
              echo "::error title=retention sweep stopped at iteration ${i}::$(printf '%s' "$OUT" | tr '\r\n' '  ' | head -c 500)"
              break
            fi
          done

      - name: Anonymous runtime sign-in — recheck after the sweep
        if: always()
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set +e
          npx convex run auth:signIn '{"provider":"anonymous"}' > /tmp/signin-after.txt 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "::notice title=anonymous sign-in AFTER sweep::PASS (guest sessions are writable again — full smoke matrix may proceed)"
          else
            tail -4 /tmp/signin-after.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=auth:signIn still failing::${line:0:600}"
            done
          fi

      - name: Fresh deployment access check (calculating-eagle-241)
        # Owner created a fresh project/deployment for the recovery. This step
        # proves, without printing any secret: (a) whether both deployment
        # hosts answer their public instance endpoint, (b) WHICH deployment
        # the workflow's deploy key targets — discriminated by the runtime
        # error text alone (old deployment says "free plan limits"; a fresh
        # undeployed one says the function does not exist) — and (c) whether
        # the fresh host accepts a PUBLIC anonymous sign-in (exactly the API
        # the app uses). Session tokens are never printed.
        if: always()
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          probe() { curl -s --max-time 20 "$1" | head -c 120; }
          echo "::notice title=old deployment instance::$(probe https://tough-goose-455.convex.cloud/instance_name)"
          echo "::notice title=new deployment instance::$(probe https://calculating-eagle-241.convex.cloud/instance_name)"
          # Non-secret fingerprint: a deploy key is "<type>:<deploymentName>|<secret>".
          # Printing ONLY the part before "|" names the deployment the saved key
          # targets and never exposes the secret itself.
          if [ -n "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::notice title=installed deploy key identifies::${CONVEX_DEPLOY_KEY%%|*} (prefix only — the secret after '|' is never printed)"
          else
            echo "::error title=deploy key::CONVEX_DEPLOY_KEY is not readable in this job"
          fi
          set +e
          npx convex run auth:signIn '{"provider":"anonymous"}' > /tmp/keytarget.txt 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "::notice title=key-targeted sign-in::PASS (the deploy key's deployment executes data-plane functions)"
          elif grep -qi "free plan limits" /tmp/keytarget.txt; then
            echo "::error title=key targets the OLD deployment::deploy key still resolves to tough-goose-455 (free-plan refused) — update the CONVEX_DEPLOY_KEY secret to the new deployment's dev key"
          elif grep -qiE "function (not found|does not exist)|Could not find public function|no function" /tmp/keytarget.txt; then
            echo "::notice title=key targets the NEW deployment::function set not deployed yet — push the backend, then re-run this check"
          else
            tail -3 /tmp/keytarget.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=key-targeted sign-in (unexpected)::${line:0:600}"
            done
          fi
          set +e
          RESP="$(curl -s --max-time 25 -X POST https://calculating-eagle-241.convex.cloud/api/mutation -H 'Content-Type: application/json' -d '{"path":"auth:signIn","args":{"provider":"anonymous"},"format":"json"}')"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error title=new-host public sign-in::curl transport error"
          elif printf '%s' "$RESP" | grep -q '"status":"success"'; then
            echo "::notice title=new-host public sign-in::SUCCESS — a real anonymous session was created via the public API (token not printed)"
          else
            printf '%s' "$RESP" | head -c 400 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=new-host public sign-in failed::${line:0:600}"
            done
          fi

      - name: Upload the (non-secret) verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-verify-${{ github.run_id }}
          path: auth-verify.json
          if-no-files-found: warn
          retention-days: 30

      - name: This job does not admit a release
        if: always()
        run: |
          echo "A CONFIGURED state proves the deployment's variables are present and plausible."
          echo "It does not prove a sign-in worked, and it is not release admission."
