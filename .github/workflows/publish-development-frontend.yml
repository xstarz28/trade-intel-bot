# Phase 300 — publish the VERIFIED frontend to the browser-facing site.
#
# WHY THIS EXISTS
# ---------------
# Phase 299 closed the build side: the artifact proves which revision it is, the
# development deploy is pinned to one branch, and a checker refuses a legacy,
# off-theme or wrong-commit bundle. It also found the hole this workflow fills:
# `convex dev` refreshes FUNCTIONS. It does not upload static files, no workflow
# in this repository hosted the site, and the browser-facing URL kept serving
# whatever the external host had built from `main` — a retired scaffold with a
# green primary, "secured by freebuff.com" and an email-OTP sign-in.
#
# So publication is its own deliberate, manual act with its own evidence:
#
#   1. the pinned branch is required (main is refused by name, and so is every
#      other ref) — the same one-line pin the development deploy uses;
#   2. the host identifiers (org, project, browser-facing URL) are PINNED
#      variables when present, otherwise READ from the credential by
#      `frontend:resolve` — which refuses rather than guessing, and never
#      creates a project;
#   3. `npm run verify:frontend` must pass on the freshly built `dist/`;
#   4. the SAME bytes are assembled into the host's Build Output API directory
#      (`.vercel/output`) and uploaded with `--prebuilt`, so the host runs NO
#      build: uploading a directory instead makes the host treat it as source
#      and run `vite build` remotely, which both fails (no dependencies in its
#      builder) and would serve bytes from a build nobody verified;
#   5. the browser-facing host is pointed at that deployment;
#   6. `npm run verify:published` FETCHES the browser-facing URL and refuses
#      acceptance unless it serves the expected branch, the exact commit, the
#      byte-identical provenance file and the same content-hashed bundles, with
#      no retired platform/OTP surface and the current Google + guest sign-in.
#
# A green run of this workflow is still not proof by itself; step 6 is, and it
# runs against the public URL rather than the pipeline. If the credential is
# absent, the run FAILS with a named reason (`HOST_CREDENTIAL_ABSENT`) instead of
# skipping the upload and reporting success.
#
# NOTE ON DISPATCH (Phase 300 finding)
# ------------------------------------
# GitHub only offers a `workflow_dispatch` workflow once its file exists on the
# repository's DEFAULT branch. This repository's default branch is `main`, which
# does not carry this file, so this workflow cannot be started from the Actions
# UI until it is reachable from the default branch. The identical publication is
# therefore also available as one command that runs wherever the credential
# lives: `VERCEL_TOKEN=... npm run frontend:publish -- --host-url https://<host>`
# (see docs/FRONTEND-PUBLICATION.md).
#
# WHAT IT DOES NOT DO
# -------------------
# · It never runs on push or pull_request — a publication is a decision.
# · It never deploys Convex functions, never touches the repository's Production
#   environment, and never changes an analysis, provider, scoring or threshold.
# · It never prints, echoes or writes a credential value; the host token is read
#   from the environment (never `argv`, so it cannot appear in a process listing)
#   and only its PRESENCE is reported. Org/project ids are identifiers, not
#   credentials, and are printed as evidence.
# · It never creates a host project.
#
# Required GitHub Environment: `development`
#   secret    VERCEL_TOKEN        a token scoped to the existing host project
#   variable  VITE_CONVEX_URL     https on *.convex.cloud (baked into the build)
# Optional (when absent, they are resolved from the token and written to the log):
#   variable  VERCEL_ORG_ID       the account/team that owns that project
#   variable  VERCEL_PROJECT_ID   the EXISTING project that serves the site
#   variable  FRONTEND_HOST_URL   the browser-facing https origin
#
# Verify-only mode needs no credential and no build: set FRONTEND_HOST_URL and it
# fetches that URL and judges it.

name: Publish development frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to publish — must be the pinned development source branch (main is refused)"
        required: true
        default: "arena/01a0d195-trade-intel-bot"
        type: string
      confirm:
        description: "Type PUBLISH_FRONTEND to confirm this replaces the browser-facing development frontend"
        required: true
        type: string
      mode:
        description: "publish = build, upload and verify; verify-only = fetch the live URL and judge it"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - verify-only
      host_url:
        description: "Optional: override the browser-facing https origin to publish to and verify"
        required: false
        default: ""
        type: string
      artifact_commit:
        description: "Optional: build THE accepted artifact from this commit (e.g. bdd1715edfb563cbe5dfc04e77f1f0203c40f659) instead of the branch tip — the published bytes are then exactly the verified phase artifact"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-development-frontend
  cancel-in-progress: false

env:
  # The one place the intended frontend source branch is declared. The guard
  # refuses every other ref by name, and the published check refuses a site whose
  # own provenance says anything else.
  XSTARZ_REQUIRED_SOURCE_BRANCH: arena/01a0d195-trade-intel-bot

jobs:
  guard:
    name: Refuse unless this is the pinned branch with a browser-facing target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      SOURCE_REF: ${{ inputs.ref || github.ref }}
      XSTARZ_FRONTEND_MODE: ${{ inputs.mode }}
      XSTARZ_FRONTEND_HOST_URL: ${{ inputs.host_url || vars.FRONTEND_HOST_URL }}
      # Presence only. The guard reports whether these are set, never a value.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Require the confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "PUBLISH_FRONTEND" ]; then
            echo "::error::Refused: type PUBLISH_FRONTEND to confirm a frontend publication."
            exit 1
          fi

      - name: Check out the selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Fail closed when the ref, the target or the credential is wrong
        # A publication that cannot be verified afterwards is not a publication,
        # so an unresolved target is refused here rather than half-performed.
        run: |
          if [ "$XSTARZ_FRONTEND_MODE" = "verify-only" ]; then
            if [ -z "$XSTARZ_FRONTEND_HOST_URL" ]; then
              echo "::error title=No browser-facing host configured::verify-only needs FRONTEND_HOST_URL (or the host_url input) to know what to fetch."
              exit 1
            fi
            npm run frontend:publish:guard -- \
              --json \
              --require-branch "$XSTARZ_REQUIRED_SOURCE_BRANCH" \
              --host-url "$XSTARZ_FRONTEND_HOST_URL" \
              --mode "$XSTARZ_FRONTEND_MODE"
            exit 0
          fi
          # publish: the credential is required, and the target must be
          # resolvable. `--no-credential` makes the guard judge the ref and the
          # URL even when it cannot judge the upload capability, so the failure
          # message names the real missing piece.
          if [ -z "$VERCEL_TOKEN" ]; then
            npm run frontend:publish:guard -- \
              --json \
              --require-branch "$XSTARZ_REQUIRED_SOURCE_BRANCH" \
              --host-url "$XSTARZ_FRONTEND_HOST_URL" \
              --mode "$XSTARZ_FRONTEND_MODE" --no-credential
            echo "::error title=Frontend NOT publishable (HOST_CREDENTIAL_ABSENT)::No host credential is configured in the 'development' environment, so the verified artifact could not be uploaded. The browser-facing site still serves whatever the host last built — most likely the retired 'main' scaffold."
            exit 1
          fi
          npm run frontend:publish:guard -- \
            --json \
            --require-branch "$XSTARZ_REQUIRED_SOURCE_BRANCH" \
            --host-url "${XSTARZ_FRONTEND_HOST_URL:-https://resolve.pending}" \
            --mode "$XSTARZ_FRONTEND_MODE"

  publish:
    name: Publish the verified artifact, then verify the published URL
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      SOURCE_REF: ${{ inputs.ref || github.ref }}
      XSTARZ_FRONTEND_MODE: ${{ inputs.mode }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Pinned identifiers, when the operator has them. Empty means "read them
      # from the credential", which the resolve step below does out loud.
      XSTARZ_PINNED_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      XSTARZ_PINNED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      XSTARZ_PINNED_HOST_URL: ${{ inputs.host_url || vars.FRONTEND_HOST_URL }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history: the pinned-artifact step below may detach to an
          # ancestor commit (e.g. the accepted phase artifact), and a shallow
          # clone would not carry its objects.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Resolve the artifact commit to build and publish
        # Empty input = build the checkout tip (previous behaviour). A pinned
        # artifact commit builds THE accepted bytes instead of re-stamping
        # whatever the tip is now; every --expect-commit below compares
        # against THIS value, so "verified" and "published" stay the same
        # bytes even though the branch tip has moved on.
        run: |
          if [ -n "${ARTIFACT_COMMIT_INPUT}" ]; then
            if ! git cat-file -e "${ARTIFACT_COMMIT_INPUT}^{commit}" 2>/dev/null; then
              echo "::error title=artifact_commit is not a commit in this history::${ARTIFACT_COMMIT_INPUT} is not reachable from this checkout"
              exit 1
            fi
            echo "XSTARZ_ARTIFACT_COMMIT=${ARTIFACT_COMMIT_INPUT}" >> "$GITHUB_ENV"
            echo "::notice title=Artifact commit pinned::building and publishing ${ARTIFACT_COMMIT_INPUT}"
          else
            echo "XSTARZ_ARTIFACT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "::notice title=Artifact commit::the checkout tip $(git rev-parse HEAD) (no artifact_commit input)"
          fi
        env:
          ARTIFACT_COMMIT_INPUT: ${{ inputs.artifact_commit }}

      - name: Detect the host credential (presence only — never a value)
        id: credential
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "state=present" >> "$GITHUB_OUTPUT"
            echo "::notice title=Host credential::present — the publication can proceed"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "::warning title=Host credential absent::VERCEL_TOKEN is not configured in the 'development' environment, so the verified artifact CANNOT be published and the browser-facing site is unchanged."
          fi

      - name: Resolve the host target (pinned values win; otherwise read from the credential)
        # This step is what removes "what do I put in VERCEL_ORG_ID?" from the
        # operator's plate: the identifiers are READ from the account the token
        # authorises, and the step fails — naming what is missing — rather than
        # inventing a project. The values it prints are identifiers, not secrets.
        if: inputs.mode == 'publish' && steps.credential.outputs.state == 'present'
        id: target
        run: |
          set -o pipefail
          if [ -n "$XSTARZ_PINNED_ORG_ID" ] && [ -n "$XSTARZ_PINNED_PROJECT_ID" ] && [ -n "$XSTARZ_PINNED_HOST_URL" ]; then
            {
              echo "VERCEL_ORG_ID=$XSTARZ_PINNED_ORG_ID"
              echo "VERCEL_PROJECT_ID=$XSTARZ_PINNED_PROJECT_ID"
              echo "XSTARZ_FRONTEND_HOST_URL=$XSTARZ_PINNED_HOST_URL"
            } >> "$GITHUB_ENV"
            echo "::notice title=Host target pinned::org/project/host came from the 'development' environment variables"
            # A pinned identifier is a CLAIM, not a fact. Verify the pinned
            # (org, project, host) against THIS job's credential. Capture the
            # successful verifier response once so the deploy step can reuse
            # the exact project name it proved, instead of performing a second
            # project-settings read that can have different authorization
            # behavior for the same project-scoped credential.
            target_report="$RUNNER_TEMP/vercel-target-check.json"
            set +e
            node scripts/verify-vercel-project-access.mjs                  --json                  --org-id "$XSTARZ_PINNED_ORG_ID"                  --project-id "$XSTARZ_PINNED_PROJECT_ID"                  --host-url "$XSTARZ_PINNED_HOST_URL"                  >"$target_report" 2>&1
            target_status=$?
            set -e
            cat "$target_report"
            if [ "$target_status" -ne 0 ]; then
              echo "::error title=Pinned Vercel target failed credential validation::The read-only target verifier refused the pinned target; its JSON evidence is printed above."
              exit 1
            fi
            project_name="$(jq -r '.projectName // empty' "$target_report")"
            if [ -z "$project_name" ]; then
              echo "::error title=Verifier returned no project name::The target was readable but did not provide the project name required by the deployment API."
              exit 1
            fi
            echo "XSTARZ_VERCEL_PROJECT_NAME=$project_name" >> "$GITHUB_ENV"
            exit 0
          fi
          npm run frontend:resolve -- \
            --json \
            --host-url "$XSTARZ_PINNED_HOST_URL" \
            > "$RUNNER_TEMP/vercel-target.json"
          cat "$RUNNER_TEMP/vercel-target.json"
          org="$(jq -r '.orgId // empty' "$RUNNER_TEMP/vercel-target.json")"
          project="$(jq -r '.projectId // empty' "$RUNNER_TEMP/vercel-target.json")"
          project_name="$(jq -r '.projectName // empty' "$RUNNER_TEMP/vercel-target.json")"
          host="$(jq -r '.hostUrl // empty' "$RUNNER_TEMP/vercel-target.json")"
          if [ -z "$org" ] || [ -z "$project" ] || [ -z "$project_name" ] || [ -z "$host" ]; then
            echo "::error title=Host target not resolvable::$(jq -r '.problems // [] | join("; ")' "$RUNNER_TEMP/vercel-target.json")"
            exit 1
          fi
          {
            echo "VERCEL_ORG_ID=$org"
            echo "VERCEL_PROJECT_ID=$project"
            echo "XSTARZ_VERCEL_PROJECT_NAME=$project_name"
            echo "XSTARZ_FRONTEND_HOST_URL=$host"
          } >> "$GITHUB_ENV"
          echo "::notice title=Host target resolved from the credential::org=${org} project=${project} host=${host} — pin these as 'development' variables to skip this step"

      - name: Check out the pinned artifact content for the build
        # Detach to the accepted artifact commit so the build consumes ITS
        # sources (the branch tip's publication scripts differ, not the app).
        # dist/ is untracked, so it survives the restore step after verify.
        if: inputs.mode == 'publish' && inputs.artifact_commit != ''
        run: |
          echo "XSTARZ_BUILD_TIP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout --detach "$XSTARZ_ARTIFACT_COMMIT"
          echo "::notice title=Detached to the artifact commit::$(git rev-parse HEAD) (the branch tip ${XSTARZ_BUILD_TIP_SHA} is restored before the upload)"

      - name: Pin build provenance to the verified checkout (never the dispatch SHA)
        # RESTORED — lost in the 4d3d8b5 plumbing: run 36821835039 recorded the
        # default-branch commit in dist/build-info.json and was rightly refused.
        # `build-provenance` prefers an explicit XSTARZ_BUILD_COMMIT over
        # GITHUB_SHA and an explicit XSTARZ_BUILD_REF over every other ref
        # source — so pin BOTH, AFTER the detach above, so the artifact records
        # exactly the commit it was built from.
        if: inputs.mode == 'publish'
        run: |
          echo "XSTARZ_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "XSTARZ_BUILD_REF=${SOURCE_REF}" >> "$GITHUB_ENV"
          echo "provenance pinned: commit=$(git rev-parse HEAD) ref=${SOURCE_REF}"

      - name: Fail closed unless VITE_CONVEX_URL is a convex.cloud HTTPS origin
        # RESTORED — lost in the 4d3d8b5 plumbing. Read from the 'development'
        # environment (vars.VITE_CONVEX_URL in the job env) — never hardcoded
        # in this file. An empty or non-convex.cloud value would bake a dead
        # backend URL into the published bundle, so the run stops BEFORE
        # building and names the exact misconfiguration.
        if: inputs.mode == 'publish'
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error title=VITE_CONVEX_URL is not set::Add the variable VITE_CONVEX_URL (https://<deployment>.convex.cloud) to the 'development' environment — the publish job builds with it, and the bundle would otherwise carry no backend URL."
            exit 1
          fi
          if ! printf '%s' "$VITE_CONVEX_URL" | grep -Eq '^https://[a-z0-9][a-z0-9-]*\.convex\.cloud$'; then
            echo "::error title=VITE_CONVEX_URL is not a convex.cloud HTTPS origin::Expected exactly https://<deployment>.convex.cloud — refusing to build and publish against the configured value (value not printed)."
            exit 1
          fi
          echo "::notice title=VITE_CONVEX_URL accepted::HTTPS origin on *.convex.cloud (value not printed)"

      - name: Build the pinned branch
        if: inputs.mode == 'publish'
        run: npm run build

      - name: Verify the built artifact before any byte leaves this runner
        if: inputs.mode == 'publish'
        id: artifact
        run: |
          npm run verify:frontend -- \
            --expect-branch "$XSTARZ_REQUIRED_SOURCE_BRANCH" \
            --expect-commit "$XSTARZ_ARTIFACT_COMMIT" \
            --require-clean
          # The two things the published check will compare against, read from
          # the artifact that just passed — not recomputed later, and not
          # recomputed by the host.
          sha="$(sha256sum dist/build-info.json | cut -d' ' -f1)"
          entry="$(grep -oE '(src|href)="[^"]+\.(js|css)"' dist/index.html | sed -E 's/.*="//; s/"$//; s|^/||' | paste -sd, -)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
          echo "::notice title=Verified artifact::commit=${XSTARZ_ARTIFACT_COMMIT} provenance-sha256=${sha}"

      - name: Restore the branch tip for the publication steps
        # The verified dist/ is untracked and survives this reset; only the
        # scripts that UPLOAD and VERIFY it return to the pinned tip (they
        # carry the vercel/vercel#17506 deploy and alias handling).
        if: inputs.mode == 'publish' && inputs.artifact_commit != ''
        run: |
          git checkout "$XSTARZ_BUILD_TIP_SHA"
          git reset --hard "$XSTARZ_BUILD_TIP_SHA"
          echo "::notice title=Branch tip restored::$(git rev-parse HEAD) — the verified artifact directory (untracked build output) is untouched"

      - name: Assemble the host's prebuilt output from the verified artifact
        if: inputs.mode == 'publish'
        # This is the step that keeps "verified" and "published" the same bytes.
        # It copies the artifact that just passed the contract into
        # `.vercel/output/static` (Build Output API) and writes the routing,
        # derived from `vercel.json`, then PROVES the copy is byte-identical and
        # carries the expected commit/branch. Nothing is built here, and nothing
        # is uploaded until this passes.
        run: |
          npm run frontend:prebuilt -- \
            --dist dist \
            --link-project \
            --expect-commit "$XSTARZ_ARTIFACT_COMMIT" \
            --expect-branch "$XSTARZ_REQUIRED_SOURCE_BRANCH"

      - name: Publish the verified bytes to the existing project (project-scoped REST)
        if: inputs.mode == 'publish' && steps.credential.outputs.state == 'present'
        id: deploy
        # Phase 300g — the deployment goes through the project-scoped REST API
        # (scripts/deploy-frontend-rest.mjs), NOT through the Vercel CLI.
        # Reproduced against a local mock of the API with CLI 62.1.0 AND 59.1.3:
        # `vercel deploy --prebuilt` performs the vercel/vercel#17506 scope
        # lookups (GET /v2/user -> 404, GET /teams/<org> -> 403 code
        # "forbidden") and throws "Could not retrieve Project Settings." BEFORE
        # uploading — no invocation shape avoids it, and the CLI tolerates only
        # the `team_unauthorized` 403 flavor. The REST path replicates the
        # CLI's EXACT prebuilt request (POST /v13/deployments?...prebuilt=1
        # with the `.vercel/output` sha list, missing-file uploads to
        # /v2/files, poll until READY) and touches ONLY project-scoped
        # endpoints. `.vercel/output` is uploaded as-is; the host runs NO
        # build; the token reaches the script through the environment, never
        # argv; the org/project ids reach it as ARGV identifiers while BOTH
        # env vars are still dropped from the child environment.
        #
        # Error handling: the CLI's stdout/stderr are captured to files and
        # BOTH are printed in full — nothing (no `tail`, no command
        # substitution under `set -e`) can swallow the deploy tool's actual
        # error again (run 36840069831 failed invisibly that way). The exit
        # code is read directly; the deployment URL is parsed from the
        # captured FULL stdout.
        run: |
          org="${XSTARZ_PINNED_ORG_ID:-${VERCEL_ORG_ID:-}}"
          project="${XSTARZ_PINNED_PROJECT_ID:-${VERCEL_PROJECT_ID:-}}"
          if [ -z "$org" ] || [ -z "$project" ]; then
            echo "::error title=No org/project ids for the REST deploy::Both identifiers are required (pinned vars or the resolve step)."
            exit 1
          fi
          out_file="$RUNNER_TEMP/rest-deploy.stdout"
          err_file="$RUNNER_TEMP/rest-deploy.stderr"
          set +e
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID node scripts/deploy-frontend-rest.mjs \
            --org-id "$org" \
            --project-id "$project" \
            --project-name "$XSTARZ_VERCEL_PROJECT_NAME" \
            --target preview \
            --expect-commit "$XSTARZ_ARTIFACT_COMMIT" \
            >"$out_file" 2>"$err_file"
          deploy_status=$?
          set -e
          echo "--- rest deploy stdout ---"
          cat "$out_file"
          echo "--- rest deploy stderr ---"
          cat "$err_file" >&2
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error title=REST deploy failed (exit ${deploy_status})::The named state and evidence are printed above. Nothing further was changed (no alias, no domain)."
            exit 1
          fi
          url="$(grep -oE 'https://[A-Za-z0-9.-]+' "$out_file" | tail -n 1)"
          case "$url" in
            https://*) ;;
            *) echo "::error title=Publication produced no deployment URL::The deploy script exited 0 but its captured stdout has no https URL."; exit 1 ;;
          esac
          echo "deployment=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Published::${url} (provenance sha256 ${{ steps.artifact.outputs.sha256 }})"

      - name: Point the browser-facing host at this exact deployment
        if: inputs.mode == 'publish' && steps.credential.outputs.state == 'present'
        # Without this the upload exists but nobody's browser sees it. A failing
        # alias fails the run: "uploaded somewhere" is not a publication.
        #
        # vercel/vercel#17506: `vercel alias set` performs a USER lookup that a
        # project-scoped token cannot satisfy, so the alias is assigned through
        # the teamId-scoped REST API instead (proven workaround — one POST, no
        # user/team scope resolution, and it creates only the alias).
        run: |
          host="$(printf '%s' "$XSTARZ_FRONTEND_HOST_URL" | sed -E 's|^https?://||; s|/.*$||')"
          if [ -z "$host" ]; then
            echo "::error title=No browser-facing host resolved::nothing to point at this deployment."
            exit 1
          fi
          deployment_host="$(printf '%s' "${{ steps.deploy.outputs.deployment }}" | sed -E 's|^https?://||; s|/.*$||')"
          body_file="$RUNNER_TEMP/alias-response.json"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' -X POST \
            "https://api.vercel.com/v2/deployments/${deployment_host}/aliases" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"${host}\"}")" || {
            echo "::error title=Alias REST call failed::curl could not reach api.vercel.com."
            exit 1
          }
          cat "$body_file" 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error title=Alias refused (HTTP ${code})::The teamId-scoped alias API refused (body above). If ${host} is this project's production domain, re-run with mode=production so the project's own domains serve it."
            exit 1
          fi
          echo "::notice title=Browser-facing host updated::https://${host} now serves ${{ steps.deploy.outputs.deployment }}"

      - name: Verify the PUBLISHED frontend — the acceptance evidence
        # This is the step that decides. Everything above is preparation; a
        # browser gets what this fetch returns.
        #
        # Launch-activation plumbing: the verifier's verdict must be readable
        # from the API (sandbox identities cannot fetch Actions logs), so on
        # failure the verifier's own failure lines are re-emitted as ::error
        # annotations. Semantics are UNCHANGED — same single verifier run
        # decides pass/fail; the second invocation below is print-only.
        run: |
          ARGS=(--url "$XSTARZ_FRONTEND_HOST_URL" --expect-branch "$XSTARZ_REQUIRED_SOURCE_BRANCH" --expect-commit "$XSTARZ_ARTIFACT_COMMIT")
          ${{ inputs.mode == 'publish' && format('ARGS+=(--expect-build-info-sha256 {0} --expect-asset-names {1})', steps.artifact.outputs.sha256, steps.artifact.outputs.entry) || '' }}
          if ! npm run verify:published -- "${ARGS[@]}"; then
            echo "::error title=Published-verify FAILED::failure lines follow as annotations"
            npm run verify:published -- "${ARGS[@]}" 2>&1 | grep -av "npm error" | tail -10 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=verify-published::${line:0:600}"
            done
            exit 1
          fi

      - name: Fail closed when the verified artifact could not be published
        if: inputs.mode == 'publish' && steps.credential.outputs.state == 'absent'
        run: |
          echo "::error title=Frontend NOT published (HOST_CREDENTIAL_ABSENT)::The pinned branch was built and verified, but no host credential is configured in the 'development' environment, so nothing was uploaded. The browser-facing site still serves whatever the host last built — most likely the retired 'main' scaffold. The published check was not run, because running it would only report on the OLD site."
          exit 1

      - name: What this run did and did not prove
        if: success()
        run: |
          echo "published commit: ${XSTARZ_ARTIFACT_COMMIT}"
          echo "source ref: ${SOURCE_REF}"
          echo "browser-facing host: $XSTARZ_FRONTEND_HOST_URL"
          if [ "${{ inputs.mode }}" = "publish" ]; then
            echo "deployment url: ${{ steps.deploy.outputs.deployment }}"
          fi
          echo "The evidence above is the FETCH of the published URL, not this workflow's status."
          echo "This is a development frontend publication. It is not production verification and not release admission."
