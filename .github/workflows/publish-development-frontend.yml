name: Retired - Vercel development frontend publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Vercel frontend publication is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy publication
        run: |
          echo "::error::Vercel frontend publication is retired. The canonical application target is the self-hosted Docker/Caddy stack."
          exit 1
