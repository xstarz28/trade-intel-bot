name: Authenticated production browser acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character commit SHA deployed to xstarzganalys.com"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: authenticated-production-browser-acceptance
  cancel-in-progress: false

jobs:
  authenticated-e2e:
    name: Restore an authorized session and verify production account surfaces
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      XSTARZ_SMOKE_URL: https://xstarzganalys.com
      XSTARZ_SMOKE_TIMEOUT_MS: "120000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require authorized Playwright storage state
        env:
          STORAGE_STATE_B64: ${{ secrets.XSTARZ_SMOKE_STORAGE_STATE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "XSTARZ_SMOKE_STORAGE_STATE=$RUNNER_TEMP/xstarz-auth-storage-state.json" >> "$GITHUB_ENV"
          if [ -z "${STORAGE_STATE_B64:-}" ]; then
            echo "::error::Missing production environment secret XSTARZ_SMOKE_STORAGE_STATE_B64. Add a Playwright storage-state JSON for an authorized test account; never commit it to the repository."
            exit 1
          fi
          printf '%s' "$STORAGE_STATE_B64" | base64 --decode > "$XSTARZ_SMOKE_STORAGE_STATE"
          chmod 600 "$XSTARZ_SMOKE_STORAGE_STATE"
          node --input-type=module - "$XSTARZ_SMOKE_STORAGE_STATE" <<'NODE'
          import { readFileSync } from "node:fs";
          const state = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(state.cookies) || !Array.isArray(state.origins)) {
            throw new Error("Storage state must contain Playwright cookies and origins arrays.");
          }
          if (state.cookies.length === 0 && state.origins.length === 0) {
            throw new Error("Storage state is empty; an authenticated session is required.");
          }
          process.stdout.write("Authorized browser storage-state structure validated; values are not logged.\n");
          NODE

      - name: Verify exact deployed revision before authenticated acceptance
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.expected_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::expected_sha must be a full 40-character commit SHA."; exit 1; }
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}" || { echo "::error::Checked-out source does not match expected_sha."; exit 1; }
          metadata="$(curl --fail --silent --show-error --max-time 10 "${XSTARZ_SMOKE_URL}/build-info.json")"
          deployed_sha="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')"
          test "${deployed_sha,,}" = "${{ inputs.expected_sha }}" || { echo "::error::Production serves ${deployed_sha:-unknown}, not requested commit ${{ inputs.expected_sha }}."; exit 1; }
          echo "Authenticated acceptance is pinned to deployed commit $deployed_sha."

      - name: Install repository and browser dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify authenticated production session and full runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/production-runtime-smoke.mjs | tee artifacts/authenticated-production-runtime-evidence.json

      - name: Upload sanitized browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-production-browser-evidence
          path: artifacts/authenticated-production-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 30
