# Phase 284 — TEMPORARY deployed-environment verification workflow.
#
# WHY THIS EXISTS
# --------------
# The agent sandbox cannot reach the Convex control plane or the deployment
# plane (every *.convex.cloud and api.convex.dev request is TLS-severed), and it
# holds no CLI credentials. A GitHub runner has normal egress, so during Phase
# 284 this is the only place the real deployed path can be exercised.
#
# WHAT IT DOES NOT DO
# -------------------
# · It does NOT deploy. There is no `convex deploy`, no schema push, no code
#   upload — it only CALLS functions that are already deployed.
# · It does NOT print any credential value. Configuration is reported by NAME
#   with PRESENT/MISSING only, and the deployment's own variables are read with
#   `convex env list --names-only`, which never generates the value side at all.
# · It does NOT touch product source. It runs `scripts/phase284-deployed-verify.mjs`
#   (temporary, verification-only) against the existing production action
#   `protectedAnalysis:runProtectedAnalysis`, over the app's own anonymous auth.
#
# NOTE ON EXPRESSIONS: presence booleans are computed once into job-level env.
# `secrets`/`vars` are not used inside step `if` expressions — a workflow that
# does so is rejected at parse time (observed: the previous revision failed in
# 0s with "workflow file issue").
#
# This file and the script it runs are removed once the observation is recorded.

name: Phase 284 deployed verification (temporary)

on:
  push:
    branches: [arena/01a0d195-trade-intel-bot]
    paths:
      - ".github/workflows/phase284-deployed-verify.yml"
      - "scripts/phase284-deployed-verify.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Repository-scoped configuration.
  deployed-verify:
    name: Deployed four-asset verification (anonymous, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      HAS_DEPLOYMENT_URL: ${{ vars.VITE_CONVEX_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repository configuration presence (names only)
        env:
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          XSTARZ_DEPLOYMENT_ENV: ${{ vars.XSTARZ_DEPLOYMENT_ENV }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          TICKATLAS_API_KEY: ${{ secrets.TICKATLAS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/phase284-deployed-verify.mjs --presence

      - name: Deployment env var NAMES (only when a deploy key is available)
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
        run: |
          set -o pipefail
          # --names-only: the value side is never generated, let alone logged.
          npx --yes convex@1.42.1 env list --prod --names-only \
            | grep -E '^[A-Z0-9_]+$' | sort -u > "$RUNNER_TEMP/deployment-env-names.txt" || true
          echo "deployment env var names recorded: $(wc -l < "$RUNNER_TEMP/deployment-env-names.txt")"

      - name: Report deployment env var names (no values)
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          PHASE284_DEPLOYMENT_ENV_NAMES_FILE: ${{ runner.temp }}/deployment-env-names.txt
        run: node scripts/phase284-deployed-verify.mjs --presence

      - name: Four assets through the deployed production action
        if: env.HAS_DEPLOYMENT_URL == 'true'
        env:
          PHASE284_DEPLOYMENT_URL: ${{ vars.VITE_CONVEX_URL }}
        run: node scripts/phase284-deployed-verify.mjs --four-asset

      - name: No repository deployment URL configured
        if: env.HAS_DEPLOYMENT_URL == 'false'
        run: |
          echo "::notice title=Phase 284 repository configuration::VITE_CONVEX_URL is not set at repository scope; see the Production-scoped job."

  # Repository-scoped configuration may be absent because the deploy key and the
  # deployment URL live in the Production environment instead. That environment
  # carries no approval gate here (observed: the job runs immediately), so this
  # job also performs the live run when the environment supplies a URL.
  production-scoped-config:
    name: Production-scoped configuration and deployed verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      HAS_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      HAS_DEPLOYMENT_URL: ${{ vars.VITE_CONVEX_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Production-scoped presence (names only)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
        run: node scripts/phase284-deployed-verify.mjs --presence

      - name: Deployment env var NAMES (only when a deploy key is available)
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
        run: |
          set -o pipefail
          npx --yes convex@1.42.1 env list --prod --names-only \
            | grep -E '^[A-Z0-9_]+$' | sort -u > "$RUNNER_TEMP/deployment-env-names.txt" || true
          echo "deployment env var names recorded: $(wc -l < "$RUNNER_TEMP/deployment-env-names.txt")"

      - name: Report deployment env var names (no values)
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          PHASE284_DEPLOYMENT_ENV_NAMES_FILE: ${{ runner.temp }}/deployment-env-names.txt
        run: node scripts/phase284-deployed-verify.mjs --presence

      - name: Four assets through the deployed production action
        if: env.HAS_DEPLOYMENT_URL == 'true'
        env:
          PHASE284_DEPLOYMENT_URL: ${{ vars.VITE_CONVEX_URL }}
        run: node scripts/phase284-deployed-verify.mjs --four-asset

      # The deployment's OWN runtime: the repository's CLI path into the
      # production deployment, calling the same production action. The guest
      # provider is disabled on this deployment (its anonymous sign-in answers
      # Server Error), so the CLI injects a verification identity; the provider
      # path under test is unchanged.
      - name: Four assets through the deployment's own runtime (convex run)
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
        run: node scripts/phase284-deployed-verify.mjs --convex-run

      # The deployment this repository's own records name as the project's dev
      # deployment (docs/UAT-MATRIX.md §35j and the Phase 212 operator run
      # sheet). Its guest provider is the app's own sign-in, so this run needs
      # no injected identity at all — it is the app's real client path.
      - name: Four assets against the documented dev deployment (app session)
        env:
          PHASE284_FALLBACK_DEPLOYMENT: https://tough-goose-455.convex.cloud
        run: node scripts/phase284-deployed-verify.mjs --four-asset-dev
