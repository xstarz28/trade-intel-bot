name: Retired - Convex development deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [development-deploy-relay]

permissions:
  contents: read

jobs:
  retired:
    name: Convex development deployment is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deployment
        run: |
          echo "::error::Convex development deployment is retired. Use the self-hosted backend; do not re-enable Convex as an application runtime."
          exit 1
