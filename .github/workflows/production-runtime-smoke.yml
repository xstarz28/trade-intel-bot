name: Production runtime smoke

on:
  # Only test the public site after a successful production deployment, or
  # when explicitly requested. A branch push does not change the production UI.
  workflow_run:
    workflows: ["Production frontend deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Real production multi-market analysis smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Playwright 1.55 has no browser/dependency image for ubuntu-latest after it moved to 26.04.
    # Pin the supported LTS runner so the real production smoke actually executes.
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    env:
      # Keep runtime smoke on the same public hostname that the release job verifies.
      XSTARZ_SMOKE_URL: https://xstarzanalysis.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      XSTARZ_SMOKE_STORAGE_STATE_B64: ${{ secrets.XSTARZ_SMOKE_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skip smoke when a newer main revision superseded this deployment
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "${latest_main_sha}" ]; then
            echo "::error::Could not resolve the current main revision; refusing an ungrounded production smoke."
            exit 1
          fi
          if [ "${EXPECTED_SHA,,}" != "${latest_main_sha,,}" ]; then
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale smoke for ${EXPECTED_SHA}; current main is ${latest_main_sha}. The newer deployment owns production verification."
          else
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            echo "Smoke revision is current main: ${EXPECTED_SHA}"
          fi

      - name: Require and prepare authenticated production browser state
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${XSTARZ_SMOKE_STORAGE_STATE_B64:-}" ]; then
            echo "::error::XSTARZ_SMOKE_STORAGE_STATE_B64 GitHub Actions secret is required; authenticated production E2E cannot be skipped."
            exit 1
          fi
          state_file="$RUNNER_TEMP/xstarz-production-storage-state.json"
          printf '%s' "$XSTARZ_SMOKE_STORAGE_STATE_B64" | base64 --decode > "$state_file"
          node --input-type=module - "$state_file" <<'NODE'
          import { readFileSync } from 'node:fs';
          const state = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!state || !Array.isArray(state.cookies) || !Array.isArray(state.origins) || (state.cookies.length === 0 && state.origins.every((origin) => !Array.isArray(origin.localStorage) || origin.localStorage.length === 0))) {
            throw new Error('Storage state must be a non-empty Playwright authenticated state with cookies or origin localStorage.');
          }
          NODE
          chmod 600 "$state_file"
          echo "XSTARZ_SMOKE_STORAGE_STATE=$state_file" >> "$GITHUB_ENV"
          echo "Authenticated browser state prepared without printing credentials."

      - name: Install repository dependencies
        if: steps.freshness.outputs.superseded != 'true'
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser harness
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify the exact revision is live on the production domain
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha=""
          for attempt in $(seq 1 12); do
            metadata="$(curl --fail --silent --show-error --max-time 10 "${XSTARZ_SMOKE_URL}/build-info.json" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')"
            if [ -n "$EXPECTED_SHA" ] && [ "${deployed_sha,,}" = "${EXPECTED_SHA,,}" ]; then
              echo "Production domain is serving exact source revision $EXPECTED_SHA"
              break
            fi
            echo "Waiting for exact production revision: expected=$EXPECTED_SHA actual=${deployed_sha:-unavailable} attempt=$attempt/12"
            sleep 5
          done
          if [ -z "$EXPECTED_SHA" ] || [ "${deployed_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "::error::Production does not serve expected revision $EXPECTED_SHA (actual: ${deployed_sha:-unavailable}); refusing to call stale output a passing smoke test."
            exit 1
          fi

      - name: Run real production analysis
        if: steps.freshness.outputs.superseded != 'true'
        run: node scripts/production-runtime-smoke.mjs

      - name: Publish smoke summary
        if: always()
        run: |
          echo "Target: ${XSTARZ_SMOKE_URL}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Superseded: ${{ steps.freshness.outputs.superseded || 'false' }}"
          echo "The smoke is green only when the current main deployment matches, guest access works, and BTC/USD, XAU/USD, EUR/USD and AAPL each render a real price snapshot, provider source and data-quality state; the page also renders a provider OHLCV chart."
