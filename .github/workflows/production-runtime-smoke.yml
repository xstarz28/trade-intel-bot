name: Production runtime smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character commit SHA deployed to xstarzganalys.com"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Real production multi-market analysis smoke
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    env:
      XSTARZ_SMOKE_URL: https://xstarzganalys.com
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate expected release revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::expected_sha must be a full 40-character commit SHA."; exit 1; }
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA,,}" || { echo "::error::Checked-out source does not match expected_sha."; exit 1; }

      - name: Install repository dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify the exact revision is live on the production domain
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha=""
          for attempt in $(seq 1 12); do
            metadata="$(curl --fail --silent --show-error --max-time 10 "${XSTARZ_SMOKE_URL}/build-info.json" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')"
            if [ "${deployed_sha,,}" = "${EXPECTED_SHA,,}" ]; then
              echo "Production domain is serving exact source revision $EXPECTED_SHA"
              break
            fi
            echo "Waiting for exact production revision: expected=$EXPECTED_SHA actual=${deployed_sha:-unavailable} attempt=$attempt/12"
            sleep 5
          done
          if [ "${deployed_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "::error::Production does not serve expected revision $EXPECTED_SHA (actual: ${deployed_sha:-unavailable}); refusing to call stale output a passing smoke test."
            exit 1
          fi

      - name: Run real production analysis
        run: node scripts/production-runtime-smoke.mjs

      - name: Publish smoke summary
        if: always()
        run: |
          echo "Target: ${XSTARZ_SMOKE_URL}"
          echo "Expected deployed commit: ${EXPECTED_SHA}"
          echo "The smoke is green only when the exact deployed revision matches, guest access works, and BTC/USD, XAU/USD, EUR/USD and AAPL each render a real price snapshot, provider source and data-quality state; the page also renders a provider OHLCV chart. Authenticated-account acceptance is handled separately."
