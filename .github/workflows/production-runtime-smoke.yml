name: Production runtime smoke

on:
  # Only test the public site after a successful production deployment, or
  # when explicitly requested. A branch push does not change the production UI.
  workflow_run:
    workflows: ["Production frontend deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Real production multi-market analysis smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      XSTARZ_SMOKE_URL: https://xstarzanalysis.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repository dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser harness
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify the exact revision is live on the production domain
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha=""
          for attempt in $(seq 1 12); do
            metadata="$(curl --fail --silent --show-error --max-time 10 "${XSTARZ_SMOKE_URL}/build-info.json" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')"
            if [ -n "$EXPECTED_SHA" ] && [ "${deployed_sha,,}" = "${EXPECTED_SHA,,}" ]; then
              echo "Production domain is serving exact source revision $EXPECTED_SHA"
              break
            fi
            echo "Waiting for exact production revision: expected=$EXPECTED_SHA actual=${deployed_sha:-unavailable} attempt=$attempt/12"
            sleep 5
          done
          if [ -z "$EXPECTED_SHA" ] || [ "${deployed_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "::error::Production does not serve expected revision $EXPECTED_SHA (actual: ${deployed_sha:-unavailable}); refusing to call stale output a passing smoke test."
            exit 1
          fi

      - name: Run real production analysis
        run: node scripts/production-runtime-smoke.mjs

      - name: Publish smoke summary
        if: always()
        run: |
          echo "Target: ${XSTARZ_SMOKE_URL}"
          echo "Commit: ${GITHUB_SHA}"
          echo "The smoke is green only when the deployed commit matches, guest access works, and BTC/USD, XAU/USD, EUR/USD and AAPL each render a real price snapshot, provider source and data-quality state; the page also renders a provider OHLCV chart."
