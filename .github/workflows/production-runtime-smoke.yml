name: Production runtime smoke

on:
  # Manual acceptance only after the self-hosted Docker/Caddy deployment is live.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Real production multi-market analysis smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Playwright 1.55 has no browser/dependency image for ubuntu-latest after it moved to 26.04.
    # Pin the supported LTS runner so the real production smoke actually executes.
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    env:
      # Run acceptance against the canonical self-hosted public hostname.
      XSTARZ_SMOKE_URL: https://xstarzganaliys.com
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skip smoke when a newer main revision superseded this deployment
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "${latest_main_sha}" ]; then
            echo "::error::Could not resolve the current main revision; refusing an ungrounded production smoke."
            exit 1
          fi
          if [ "${EXPECTED_SHA,,}" != "${latest_main_sha,,}" ]; then
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale smoke for ${EXPECTED_SHA}; current main is ${latest_main_sha}. The newer deployment owns production verification."
          else
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            echo "Smoke revision is current main: ${EXPECTED_SHA}"
          fi

      - name: Install repository dependencies
        if: steps.freshness.outputs.superseded != 'true'
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install browser harness
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify the exact revision is live on the production domain
        if: steps.freshness.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha=""
          for attempt in $(seq 1 12); do
            metadata="$(curl --fail --silent --show-error --max-time 10 "${XSTARZ_SMOKE_URL}/build-info.json" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$metadata" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')"
            if [ -n "$EXPECTED_SHA" ] && [ "${deployed_sha,,}" = "${EXPECTED_SHA,,}" ]; then
              echo "Production domain is serving exact source revision $EXPECTED_SHA"
              break
            fi
            echo "Waiting for exact production revision: expected=$EXPECTED_SHA actual=${deployed_sha:-unavailable} attempt=$attempt/12"
            sleep 5
          done
          if [ -z "$EXPECTED_SHA" ] || [ "${deployed_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "::error::Production does not serve expected revision $EXPECTED_SHA (actual: ${deployed_sha:-unavailable}); refusing to call stale output a passing smoke test."
            exit 1
          fi

      - name: Run real production analysis
        if: steps.freshness.outputs.superseded != 'true'
        run: node scripts/production-runtime-smoke.mjs

      - name: Publish smoke summary
        if: always()
        run: |
          echo "Target: ${XSTARZ_SMOKE_URL}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Superseded: ${{ steps.freshness.outputs.superseded || 'false' }}"
          echo "The smoke is green only when the current main deployment matches, guest access works, and BTC/USD, XAU/USD, EUR/USD and AAPL each render a real price snapshot, provider source and data-quality state; the page also renders a provider OHLCV chart. Authenticated-account acceptance is handled separately by the Authenticated production browser acceptance workflow."
