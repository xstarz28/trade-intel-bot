name: Set free XSTARZG public hostname

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  configure-free-hostname:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Rename project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"             -H "Authorization: Bearer ${VERCEL_TOKEN}"             -H "Content-Type: application/json"             -d '{"name":"xstarzanalysis"}'

      - name: Attach free branded hostname
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains"             -H "Authorization: Bearer ${VERCEL_TOKEN}"             -H "Content-Type: application/json"             -d '{"name":"xstarzanalysis.vercel.app"}'

      - name: Verify hostname is attached
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          curl -fsS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains"             -H "Authorization: Bearer ${VERCEL_TOKEN}" |
            python -c "import json,sys; d=json.load(sys.stdin); names=[x.get('name') for x in d.get('domains',[])]; print(names); assert 'xstarzanalysis.vercel.app' in names"
