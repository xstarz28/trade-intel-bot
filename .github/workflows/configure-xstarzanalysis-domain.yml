name: Set free XSTARZG public hostname

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rename-project:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Rename Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" -d '{"name":"xstarzanalysis"}'
          echo "Free public hostname target: https://xstarzanalysis.vercel.app"
