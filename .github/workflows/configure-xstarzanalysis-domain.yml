name: Retired - Vercel branded domain configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Vercel domain configuration is retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy domain changes
        run: |
          echo "::error::Vercel domain configuration is retired. The canonical hostname is xstarzganaliys.com and is managed through DNS plus the self-hosted Caddy endpoint."
          exit 1
