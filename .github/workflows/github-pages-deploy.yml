name: GitHub Pages frontend

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/github-pages-deploy.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/github-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build static frontend
        env:
          NODE_ENV: production
          XSTARZ_BUILD_REF: ${{ github.ref_name }}
          XSTARZ_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          cp dist/index.html dist/404.html
          test -s dist/CNAME
          grep -Fx "xstarzganaliys.com" dist/CNAME

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set the verified custom domain
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_DOMAIN: xstarzganaliys.com
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \\
            -f build_type=workflow \\
            -f cname="${CUSTOM_DOMAIN}"

      - name: Deploy static frontend
        id: deployment
        uses: actions/deploy-pages@v4
